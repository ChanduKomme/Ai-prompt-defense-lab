[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptshield"
version = "1.0.0"
description = "Offline lab for attacking and defending a RAG support agent against prompt injection"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Chandu Komme"}]
requires-python = ">=3.10"
keywords = ["prompt-injection", "llm-security", "owasp-llm", "red-team", "rag"]

[project.scripts]
promptshield = "promptshield.__main__:main"

[tool.setuptools]
packages = ["promptshield"]
